services:
  postgres:
    image: postgres:17
    container_name: airport-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ###########
      POSTGRES_USER: ###########
      POSTGRES_PASSWORD: ###########

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  flask:
    build: .
    container_name: airport-flask
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      DB_HOST: ###########
      DB_PORT: ###########
      DB_NAME: ###########
      DB_USER: ###########
      DB_PASSWORD: ###########

    depends_on:
      - postgres

volumes:
  postgres_data: